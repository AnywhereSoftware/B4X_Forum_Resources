<svg xmlns="http://w3.org" id="tile-slider" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Groove Track Contrast Depth Fill -->
    <linearGradient id="sliderTrackBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <!-- Machined Metal Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="30%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <filter id="handleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="6" fill="transparent" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">SLIDER</text>

  <!-- INTERACTIVE TARGET LAYER -->
  <rect id="hmi-touch-zone" x="15" y="35" width="90" height="30" fill="#ffffff" opacity="0" />

  <!-- The Physical Groove Track Line , rx sets rounding -->
  <rect x="20" y="47" width="80" height="6" rx="0" fill="url(#sliderTrackBg)" stroke="#090d16" stroke-width="1" pointer-events="none" />
  
  <!-- Active Highlight Progress Rail -->
  <line id="hmi-progress" x1="20" y1="50" x2="20" y2="50" stroke="#38bdf8" stroke-width="4" stroke-linecap="butt" pointer-events="none" />

  <!-- The Slider Handle Knob , rx sets rounding -->
  <rect id="hmi-handle" x="15" y="38" width="10" height="24" rx="0" fill="url(#handleGrad)" stroke="#1e293b" stroke-width="1" filter="url(#handleShadow)" pointer-events="none" />

  <!-- DYNAMIC VALUE DISPLAY -->
  <text id="slider-val" x="60" y="90" font-family="monospace" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">0%</text>

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">footer</text>
</svg>
