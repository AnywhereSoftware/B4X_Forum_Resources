<svg xmlns="http://w3.org" id="tile-watchdog" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background tile fill -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="120" height="120" rx="0" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER (Library Standard) -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">WATCHDOG</text>

  <!-- INDUSTRIAL SUB-PANEL BEZEL FRAME -->
  <!-- This provides the heavy electrical / hardware equipment aesthetic -->
  <rect id="status-panel-bg" x="18" y="34" width="84" height="52" rx="2" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

  <!-- CENTRAL DISPLAY VALUE (Perfect Vertical Alignment inside Bezel) -->
  <text id="value-display" x="60" y="60" font-family="Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace" font-size="22" font-weight="bold" fill="#38bdf8" text-anchor="middle" dominant-baseline="central">12ms</text>

  <!-- HIGH-VISIBILITY STATUS DOT INDICATOR -->
  <circle id="status-dot" cx="104" cy="16" r="4" fill="#22c55e" />

  <!-- FIXED LIBRARY STANDARD FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">ONLINE</text>
</svg>
