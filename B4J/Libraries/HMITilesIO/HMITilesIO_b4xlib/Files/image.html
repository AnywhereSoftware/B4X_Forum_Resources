<!DOCTYPE html>
<html>
<head>
  <style>
	/* Completely resets the B4J WebEngine defaults and strips scrollbars */
	html, body {
	  margin: 0;
	  padding: 0;
	  width: 100%;
	  height: 100%;
	  overflow: hidden;
	  background-color: transparent;
	  display: flex;
	  justify-content: center;
	  align-items: center;
	}
	
	svg {
	  width: 100vw;
	  height: 100vh;
	  display: block;
	}
	
	/* Smoothly glides the level fluid surface vertically during real-time updates */
	#tank-fluid {
		transition: y 0.5s ease-in-out, height 0.5s ease-in-out;
	}
  </style>
</head>
<body>
#IMAGE_PLACEHOLDER#
</body>
</html>
