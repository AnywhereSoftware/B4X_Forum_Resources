<svg xmlns="http://w3.org" id="tile-quad" viewBox="0 0 120 120" width="120" height="120">
  <!-- Base Grid Tile Frame (Matching library layout standards) -->
  <rect width="120" height="120" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

  <!-- MAIN FIXED TILE HEADER (Tuned down to y="18" for absolute horizontal parity) -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">OVERVIEW</text>

  <!-- ==================== QUADRANT MATRIX GRID ==================== -->
  
  <!-- --- TOP LEFT: QUADRANT 1 (e.g., Solar) --- -->
  <g id="quad-1">
    <text x="32" y="34" font-family="sans-serif" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Solar</text>
    <text id="q1-value" x="32" y="47" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle" dominant-baseline="central">2288</text>
    <text x="32" y="58" font-family="sans-serif" font-size="7" font-weight="bold" fill="#94a3b8" text-anchor="middle">W</text>
  </g>

  <!-- --- TOP RIGHT: QUADRANT 2 (e.g., House) --- -->
  <g id="quad-2">
    <text x="88" y="34" font-family="sans-serif" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">House</text>
    <text id="q2-value" x="88" y="47" font-family="monospace" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="central">178</text>
    <text x="88" y="58" font-family="sans-serif" font-size="7" font-weight="bold" fill="#94a3b8" text-anchor="middle">W</text>
  </g>

  <!-- SUBTLE INNER AXIS DIVIDERS (Tighter boundaries to look cleaner when quads hide) -->
  <line id="divider-h" x1="22" y1="64" x2="98" y2="64" stroke="#f1f5f9" stroke-width="1" />
  <line id="divider-v" x1="60" y1="28" x2="60" y2="98" stroke="#f1f5f9" stroke-width="1" />

  <!-- --- BOTTOM LEFT: QUADRANT 3 (e.g., Grid) --- -->
  <g id="quad-3">
    <text x="32" y="74" font-family="sans-serif" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Grid</text>
    <text id="q3-value" x="32" y="87" font-family="monospace" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="middle" dominant-baseline="central">9</text>
    <text x="32" y="98" font-family="sans-serif" font-size="7" font-weight="bold" fill="#94a3b8" text-anchor="middle">W</text>
  </g>

  <!-- --- BOTTOM RIGHT: QUADRANT 4 (e.g., Battery) --- -->
  <g id="quad-4">
    <text x="88" y="74" font-family="sans-serif" font-size="8" font-weight="600" fill="#64748b" text-anchor="middle">Battery</text>
    <text id="q4-value" x="88" y="87" font-family="monospace" font-size="12" font-weight="bold" fill="#ffb900" text-anchor="middle" dominant-baseline="central">31</text>
    <text x="88" y="98" font-family="sans-serif" font-size="7" font-weight="bold" fill="#94a3b8" text-anchor="middle">%</text>
  </g>

  <!-- ============================================================== -->

  <!-- FIXED TILE FOOTER (Anchored to y="110" for solid layout alignment) -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">System State</text>
</svg>
