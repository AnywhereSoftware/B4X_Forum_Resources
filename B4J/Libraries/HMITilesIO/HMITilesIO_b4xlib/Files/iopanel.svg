<svg xmlns="http://www.w3.org/2000/svg" id="tile-iopanel" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="stateOff" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#991b1b"/></linearGradient>
    <linearGradient id="stateOn" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#166534"/></linearGradient>
    <linearGradient id="stateDisabled" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
  </defs>

  <rect width="120" height="120" rx="0" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">IO PANEL</text>

  <!-- Row 1: Channels 0 to 3 (Centered horizontally in their 20px widths) -->
  <g><rect id="ch0" x="12" y="32" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" /><text id="ch-txt0" x="22" y="47" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" letter-spacing="-0.5" pointer-events="none">IO0</text></g>
  <g><rect id="ch1" x="38" y="32" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" /><text id="ch-txt1" x="48" y="47" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" letter-spacing="-0.5" pointer-events="none">IO1</text></g>
  <g><rect id="ch2" x="64" y="32" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" /><text id="ch-txt2" x="74" y="47" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" letter-spacing="-0.5" pointer-events="none">IO2</text></g>
  <g><rect id="ch3" x="90" y="32" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" /><text id="ch-txt3" x="100" y="47" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" letter-spacing="-0.5" pointer-events="none">IO3</text></g>

  <!-- Row 2: Channels 4 to 7 -->
  <g><rect id="ch4" x="12" y="64" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" /><text id="ch-txt4" x="22" y="79" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" letter-spacing="-0.5" pointer-events="none">IO4</text></g>
  <g><rect id="ch5" x="38" y="64" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" /><text id="ch-txt5" x="48" y="79" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" letter-spacing="-0.5" pointer-events="none">IO5</text></g>
  <g><rect id="ch6" x="64" y="64" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" /><text id="ch-txt6" x="74" y="79" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" letter-spacing="-0.5" pointer-events="none">IO6</text></g>
  <g><rect id="ch7" x="90" y="64" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" /><text id="ch-txt7" x="100" y="79" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" letter-spacing="-0.5" pointer-events="none">IO7</text></g>

  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">0000</text>
</svg>
