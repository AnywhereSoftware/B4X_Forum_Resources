<svg xmlns="http://www.w3.org/2000/svg" id="tile-icon-indicator" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Dark structural tile backing matching your library standard -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="0" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">SYSTEM STATUS</text>

  <!-- CENTRAL IMAGE CONTROLLER -->
  <!-- Centered at X=60, Y=60 with size 44x44. The 'href' will be manipulated by JS -->
  <image id="tile-icon" x="38" y="38" width="44" height="44" href="info.png" />

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">All Systems Nominal</text>
</svg>
