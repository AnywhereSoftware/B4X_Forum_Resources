<svg xmlns="http://www.w3.org/2000/svg" id="tile-bytestatus" viewBox="0 0 120 120" width="120" height="120">
	<defs>
		<linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#1e293b" />
			<stop offset="100%" stop-color="#0f172a" />
		</linearGradient>

		<!-- Industrial States Color Palette -->
		<linearGradient id="stateOff" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#991b1b"/></linearGradient>
		<linearGradient id="stateOn" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#166534"/></linearGradient>
		<linearGradient id="stateDisabled" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#334155"/></linearGradient>
	</defs>

	<!-- Base Grid Tile Frame -->
  <	rect width="120" height="120" rx="0" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

	<!-- DYNAMIC TEXT HEADER -->
	<text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">BYTE STATUS</text>

	<!-- DYNAMIC TEXT CONTENT MID CENTERED -->
	<text x="60" y="60" fill="#ffffff" font-family="sans-serif" font-size="20" text-anchor="middle">No Asset</text>

	<!-- DYNAMIC TEXT FOOTER -->
	<text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">0x00</text>
</svg>
