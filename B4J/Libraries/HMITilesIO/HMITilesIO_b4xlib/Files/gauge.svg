<svg xmlns="http://w3.org" id="tile-gauge" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="needleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="120" height="120" rx="6" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">GAUGE</text>

  <!-- 180-DEGREE SECTOR ARCS (Pivot center at 60, 80) -->
  <!-- Total Arc Length = PI * Radius 36 = 113.1px -->
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <!-- Layer 1: Base Red Background (Full Arc) -->
    <path id="arc-red" d="M 24 80 A 36 36 0 0 1 96 80" stroke="#ef4444" />
    
    <!-- Layer 2: Yellow Mask (Clips backward from the right) -->
    <path id="arc-yellow" d="M 24 80 A 36 36 0 0 1 96 80" stroke="#eab308" stroke-dasharray="113.1" stroke-dashoffset="113.1" />
    
    <!-- Layer 3: Green Mask (Clips backward from the right) -->
    <path id="arc-green" d="M 24 80 A 36 36 0 0 1 96 80" stroke="#22c55e" stroke-dasharray="113.1" stroke-dashoffset="113.1" />
  </g>

  <!-- HIGH-CONTRAST NEON CYAN NEEDLE -->
  <g id="gauge-needle" filter="url(#needleShadow)">
    <path d="M 58.5 80 L 60 36 L 61.5 80 Z" fill="#38bdf8" />
    <circle cx="60" cy="80" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="60" cy="80" r="1.5" fill="#ffffff" />
  </g>

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">footer</text>
</svg>
