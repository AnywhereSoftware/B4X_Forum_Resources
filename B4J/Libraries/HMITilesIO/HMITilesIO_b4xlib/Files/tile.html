<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style type="text/css">
	/* Completely resets default dimensions and clips scrollbars cross-platform */
	html, body {
	  margin: 0;
	  padding: 0;
	  width: 100%;
	  height: 100%;
	  overflow: hidden;
	  background-color: transparent;
	  
	  /* Uses CSS Flexbox to lock the inner SVG dead-center in the container */
	  display: flex;
	  justify-content: center;
	  align-items: center;
	}
	
	svg {
	  /* Forces the vector canvas to fluently fill out 100% of the parent view container size */
	  width: 100%;
	  height: 100%;
	  display: block;
	}
  </style>
</head>
<body id="tile-body">
#IMAGE_PLACEHOLDER#
</body>
</html>
