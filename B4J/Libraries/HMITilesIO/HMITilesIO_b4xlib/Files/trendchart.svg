<svg xmlns="http://www.w3.org/2000/svg" id="tile-sparkline" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Dark structural tile backing matching your library standard -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="0" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">TREND</text>

  <!-- AXIS LINES (Left Y-Axis & Bottom X-Axis baseline grid) -->
  <line x1="25" y1="35" x2="25" y2="85" stroke="#cbd5e1" stroke-width="1" />
  <line x1="25" y1="85" x2="115" y2="85" stroke="#cbd5e1" stroke-width="1" />

  <!-- MIN / MAX SCALE LABELS (Left aligned next to the Y-axis) -->
  <text id="scale-max" x="23" y="38" font-family="monospace" font-size="9" font-weight="600" fill="#64748b" text-anchor="end"></text>
  <text id="scale-min" x="23" y="85" font-family="monospace" font-size="9" font-weight="600" fill="#64748b" text-anchor="end"></text>

  <!-- TREND GRAPH PATH -->
  <!-- Shifted start X to 27 to leave room for the Y-Axis and numbers -->
  <polyline id="sparkline-path" points="" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- CURRENT VALUE READOUT -->
  <text id="current-value" x="60" y="95" font-family="monospace" font-size="12" font-weight="bold" fill="#310062" text-anchor="middle"></text>

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">footer</text>
</svg>
