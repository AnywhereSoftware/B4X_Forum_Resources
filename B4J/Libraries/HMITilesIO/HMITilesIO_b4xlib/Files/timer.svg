<svg xmlns="http://www.w3.org/2000/svg" id="tile-timer" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <rect id="tile-frame" width="120" height="120" rx="0" fill="#FRAME_FILL#" stroke="#FRAME_STROKE#" stroke-width="#FRAME_STROKE_WIDTH#" />

  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="#HEADER_FONT_SIZE#" font-weight="600" fill="#HEADER_FILL#" text-anchor="middle" letter-spacing="0.5">#HEADER_TEXT#</text>

  <!-- MATCHED BACKGROUND TRACK (Stroke updated to 3.5) -->
  <circle cx="60" cy="60" r="30" fill="none" stroke="#e2e8f0" stroke-width="3.5" />
  
  <!-- MATCHED PROGRESS RING (Stroke updated to 3.5) -->
  <circle id="timer-ring" cx="60" cy="60" r="30" fill="none" stroke="#3b82f6" stroke-width="3.5" 
          stroke-dasharray="188.5" stroke-dashoffset="188.5" stroke-linecap="round" transform="rotate(-90 60 60)" />

  <text id="tile-value" x="60" y="60" font-family="monospace" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="central">00:00:00</text>

  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="#FOOTER_FONT_SIZE#" font-weight="600" fill="#FOOTER_FILL#" text-anchor="middle">#FOOTER_TEXT#</text>
</svg>