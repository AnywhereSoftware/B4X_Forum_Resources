<svg xmlns="http://www.w3.org/2000/svg" id="tile-timer" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Your standard structural light tile backing -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="0" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">TIMER</text>

  <!-- MID-SIZE BACKGROUND TRACKING CIRCLE (Radius balanced at 30) -->
  <circle cx="60" cy="56" r="30" fill="none" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- MID-SIZE DYNAMIC PROGRESS RING -->
  <!-- New Circumference is 2 * PI * r = 2 * 3.14159 * 30 = 188.49 (Rounded to 188.5) -->
  <circle id="timer-ring" cx="60" cy="56" r="30" fill="none" stroke="#3b82f6" stroke-width="3" 
          stroke-dasharray="188.5" stroke-dashoffset="188.5" stroke-linecap="round" transform="rotate(-90 60 56)" />

  <!-- MAIN TIME READOUT -->
  <!-- Defaulting to font-size="24" for clean double-digits; JavaScript will shrink it automatically for long clock strings -->
  <text id="current-value" x="60" y="56" font-family="monospace" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="central">00:00:00</text>

  <!-- FIXED LIBRARY STANDARD FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Footer</text>
</svg>
