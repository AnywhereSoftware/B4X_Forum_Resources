<svg xmlns="http://w3.org" id="tile-value" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Dark structural tile backing matching your library standard -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="6" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">HEADER</text>

  <!-- CENTRAL DISPLAY VALUE -->
  <!-- Uses dominant-baseline to lock vertical centering perfectly during text-size changes -->
  <text id="value-display" x="60" y="60" font-family="monospace" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="central">---</text>

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="106" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">footer</text>
</svg>
