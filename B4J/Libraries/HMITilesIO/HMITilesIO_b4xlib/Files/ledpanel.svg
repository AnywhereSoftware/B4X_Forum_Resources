<svg xmlns="http://w3.org" id="tile-led" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Dark structural tile backing -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- LED Status Glows -->
    <radialGradient id="ledGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="20%" stop-color="#22c55e" />
      <stop offset="70%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>
    
    <radialGradient id="ledOff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </radialGradient>

    <!-- Soft diffuse glow filter for active statuses -->
    <filter id="lensGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="6" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">LEDPANEL</text>

  <!-- CENTRAL HARDWARE ITEM: LED Lens Base (Centered at 60, 60) -->
  <circle cx="60" cy="62" r="22" fill="#020617" stroke="#475569" stroke-width="2" />
  
  <!-- The Target element manipulated by your B4X Sub (Defaults to OFF state) -->
  <circle id="led-lens" cx="60" cy="62" r="18" fill="url(#ledOff)" />
  
  <!-- Shiny plastic reflection overlay to look realistic -->
  <path d="M 48 54 A 14 14 0 0 1 66 46" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">FOOTER</text>
</svg>
