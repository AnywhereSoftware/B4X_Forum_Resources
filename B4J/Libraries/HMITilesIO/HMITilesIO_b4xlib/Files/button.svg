<svg xmlns="http://w3.org" id="tile-button" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Dark structural tile backing -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- LED Status Glows -->
    <radialGradient id="ledGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="20%" stop-color="#22c55e" />
      <stop offset="70%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>
    
    <radialGradient id="ledOff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </radialGradient>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="0" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">BUTTON</text>

  <!-- 3D BUTTON HOUSING (Creates tactile affordance) -->
  <!-- Outer Drop Shadow -->
  <circle cx="60" cy="65" r="23" fill="#020617" opacity="0.6" />
  <!-- Beveled Raised Ring (Light top-border accent) -->
  <circle cx="60" cy="62" r="23" fill="#334155" stroke="#64748b" stroke-width="1.5" />
  <!-- Deep Inner Socket -->
  <circle cx="60" cy="62" r="19" fill="#020617" />
  
  <!-- The Target element (Defaults to OFF state) -->
  <circle id="led-lens" cx="60" cy="62" r="16" fill="url(#ledOff)" />
  
  <!-- Shiny plastic reflection overlay -->
  <path d="M 50 55 A 12 12 0 0 1 64 48" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">FOOTER</text>
</svg>
