<svg xmlns="http://www.w3.org/2000/svg" id="tile-value" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Dark structural tile backing matching your library standard -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Base Grid Tile Frame (Invisible touch hit-area wrapper) -->
  <rect width="120" height="120" rx="0" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">SELECT</text>

  <!-- CENTRAL DISPLAY VALUE -->
  <!-- Monospace value text takes up the full width since there are no flanking buttons -->
  <text id="value-display" x="60" y="60" font-family="monospace" font-size="22" font-weight="bold" fill="#00E5FF" text-anchor="middle" dominant-baseline="central">---</text>

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">footer</text>
</svg>
