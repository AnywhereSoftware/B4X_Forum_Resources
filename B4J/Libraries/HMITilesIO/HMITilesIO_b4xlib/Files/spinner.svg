<svg xmlns="http://www.w3.org/2000/svg" id="tile-spinner" viewBox="0 0 120 120" width="100%" height="100%">
	<defs>
		<!-- Dark structural tile backing matching your library standard -->
		<linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#1e293b" />
			<stop offset="100%" stop-color="#0f172a" />
		</linearGradient>

		<!-- CONTROL GRADIENT: High-contrast structural slate gray -->
		<linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#64748b" />
			<stop offset="100%" stop-color="#475569" />
		</linearGradient>
	</defs>

	<!-- Base Grid Tile Frame -->
	<rect id="tile-frame" width="120" height="120" rx="0" fill="#FRAME_FILL#" stroke="#FRAME_STROKE#" stroke-width="#FRAME_STROKE_WIDTH#" />

	<!-- DYNAMIC TEXT HEADER -->
	<text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="#HEADER_FONT_SIZE#" font-weight="600" fill="#HEADER_FILL#" text-anchor="middle" letter-spacing="0.5">#HEADER_TEXT#</text>

	<!-- LEFT BUTTON: MINUS [-] (Lighter structural face with pronounced light-slate border edge) -->
	<rect id="btn-minus" x="12" y="40" width="28" height="40" rx="4" fill="url(#btnGrad)" stroke="#94a3b8" stroke-width="1.2" />
	<!-- Minus sign -->
	<line x1="20" y1="60" x2="32" y2="60" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

	<!-- CENTRAL VALUE DISPLAY -->
	<text id="tile-value" x="60" y="60" font-family="monospace" font-size="#VALUE_FONT_SIZE#" font-weight="bold" fill="#VALUE_FILL#"  text-anchor="middle" dominant-baseline="central">68</text>

	<!-- RIGHT BUTTON: PLUS [+] -->
	<rect id="btn-plus" x="80" y="40" width="28" height="40" rx="4" fill="url(#btnGrad)" stroke="#94a3b8" stroke-width="1.2" />
	<!-- Plus sign -->
	<line x1="88" y1="60" x2="100" y2="60" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
	<line x1="94" y1="54" x2="94" y2="66" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

	<!-- DYNAMIC TEXT FOOTER -->
	<text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="#FOOTER_FONT_SIZE#" font-weight="600" fill="#FOOTER_FILL#" text-anchor="middle">#FOOTER_TEXT#</text>
</svg>