<svg xmlns="http://w3.org" id="tile-jogger" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Dark structural tile backing matching your library standard -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- ISA-101 COMPLIANT CONTROL GRADIENT: High-contrast structural slate gray -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="6" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">JOGGER</text>

  <!-- LEFT BUTTON: MINUS [-] (Lighter structural face with pronounced light-slate border edge) -->
  <rect id="btn-minus" x="12" y="40" width="28" height="40" rx="4" fill="url(#btnGrad)" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="20" y1="60" x2="32" y2="60" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

  <!-- CENTRAL VALUE DISPLAY -->
  <text id="value-display" x="60" y="60" font-family="monospace" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="middle" dominant-baseline="central">68</text>

  <!-- RIGHT BUTTON: PLUS [+] -->
  <rect id="btn-plus" x="80" y="40" width="28" height="40" rx="4" fill="url(#btnGrad)" stroke="#94a3b8" stroke-width="1.2" />
  <line x1="88" y1="60" x2="100" y2="60" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <line x1="94" y1="54" x2="94" y2="66" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="106" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Footer</text>
</svg>
