<svg xmlns="http://w3.org" id="tile-loadingindicator" viewBox="0 0 120 120" width="100%" height="100%">
  <style>
    .indicator-group {
      transform-origin: 60px 60px !important;
      transition: opacity 0.2s ease;
    }
    
    .ring-track { fill: none; stroke: #f1f5f9; stroke-width: 3.5; }
    
    .ring-main { 
      fill: none; 
      stroke-width: 3.5; 
      stroke-linecap: round;
      transition: stroke 0.4s ease, stroke-dasharray 0.4s ease;
    }

    /* --- STATE: START (Spinning Blue Segment) --- */
    .is-loading .indicator-group {
      animation: hmi-spin 1.5s linear infinite;
    }
    .is-loading .ring-main {
      stroke: #3b82f6;         
      stroke-dasharray: 65 123; 
    }

    /* --- STATE: STOP (Solid Finished Circle) --- */
    .is-stopped .ring-main {
      stroke: #64748b;         
      stroke-dasharray: 189 0;  
    }

    @keyframes hmi-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Base Grid Tile Frame -->
  <rect id="tile-frame" width="120" height="120" rx="0" fill="#FRAME_FILL#" stroke="#FRAME_STROKE#" stroke-width="#FRAME_STROKE_WIDTH#" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="#HEADER_FONT_SIZE#" font-weight="600" fill="#HEADER_FILL#" text-anchor="middle" letter-spacing="0.5">#HEADER_TEXT#</text>

  <!-- CENTRAL LOADING GRAPHIC ENGINE -->
  <!-- Crucial Fix: Changed default class to 'is-stopped' to prevent it from being stuck spinning on layout load -->
  <g id="stateContainer" class="is-stopped">
    <g class="indicator-group">
      <circle cx="60" cy="60" r="30" class="ring-track" />
      <circle cx="60" cy="60" r="30" class="ring-main" transform="rotate(-90 60 60)" />
    </g>
  </g>

  <!-- CENTRAL DISPLAY VALUE -->
  <text id="tile-value" x="60" y="60" font-family="monospace" font-size="#VALUE_FONT_SIZE#" font-weight="bold" fill="#VALUE_FILL#" text-anchor="middle" dominant-baseline="central">#VALUE_TEXT#</text>

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="#FOOTER_FONT_SIZE#" font-weight="600" fill="#FOOTER_FILL#" text-anchor="middle">#FOOTER_TEXT#</text>
</svg>
