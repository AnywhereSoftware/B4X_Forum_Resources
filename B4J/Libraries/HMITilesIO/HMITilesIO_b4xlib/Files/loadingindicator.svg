<svg xmlns="http://w3.org" id="tile-value" viewBox="0 0 120 120" width="120" height="120">
  <style>
    .indicator-group {
      transform-origin: 60px 60px !important;
    }
    
    .ring-track { fill: none; stroke: #f1f5f9; stroke-width: 3.5; }
    
    .ring-main { 
      fill: none; 
      stroke-width: 3.5; 
      stroke-linecap: round;
      transition: stroke 0.4s ease, stroke-dasharray 0.4s ease;
    }

    /* --- STATE: START (Spinning Blue Segment) --- */
    .is-loading .indicator-group {
      animation: hmi-spin 1.5s linear infinite;
    }
    .is-loading .ring-main {
      stroke: #3b82f6;         
      stroke-dasharray: 65 123; 
    }

    /* --- STATE: STOP (Solid Finished Circle) --- */
    .is-stopped .ring-main {
      stroke: #64748b;         
      stroke-dasharray: 189 0;  
    }

    @keyframes hmi-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">LOADINGINDICATOR</text>

  <!-- CENTRAL LOADING GRAPHIC ENGINE -->
  <g id="stateContainer" class="is-loading">
    <g class="indicator-group">
      <circle cx="60" cy="60" r="30" class="ring-track" />
      <!-- Added -90deg rotation to match the 12 o'clock starting position of the timer -->
      <circle cx="60" cy="60" r="30" class="ring-main" transform="rotate(-90 60 60)" />
    </g>
  </g>

  <!-- CENTRAL DISPLAY VALUE -->
  <text id="value-display" x="60" y="60" 
        font-family="monospace" 
        font-size="24" 
        font-weight="bold" 
        fill="#0f172a" 
        text-anchor="middle" 
        dominant-baseline="central"></text>

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Footer</text>
</svg>
