<svg xmlns="http://www.w3.org/2000/svg" id="tile-battery" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Your standard structural light tile backing -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="0" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">SIGNAL</text>

  <!-- SIGNAL STRENGTH BARS (ALL SHIFTED UP FOR VERICAL BALANCE) -->
  <!-- Set to fill="none" by default; JavaScript will toggle their visibility/color -->
  <!-- SIGNAL STRENGTH BARS (Default unlit structural state) -->
  <!-- Changed fill from none to #cbd5e1 to make empty slots visible -->
  <rect id="sig-bar1" x="40" y="68" width="6" height="14" rx="1" fill="#cbd5e1" />
  <rect id="sig-bar2" x="50" y="56" width="6" height="26" rx="1" fill="#cbd5e1" />
  <rect id="sig-bar3" x="60" y="44" width="6" height="38" rx="1" fill="#cbd5e1" />
  <rect id="sig-bar4" x="70" y="32" width="6" height="50" rx="1" fill="#cbd5e1" />

  <!-- CURRENT VALUE READOUT -->
  <!-- Moved to Y=96 to align perfectly with your battery layout baseline -->
  <text id="current-value" x="60" y="96" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">--- dBm</text>

  <!-- FIXED LIBRARY STANDARD FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">footer</text>
</svg>
