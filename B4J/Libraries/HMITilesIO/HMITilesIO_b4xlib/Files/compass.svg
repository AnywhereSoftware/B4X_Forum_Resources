<svg xmlns="http://w3.org" id="tile-compass" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background tile fill -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <!-- Drop shadow for the directional arrow -->
    <filter id="arrowShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="120" height="120" rx="0" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER (Library Standard) -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">COMPASS</text>

  <!-- COMPASS DIAL BOUNDARY & COMPASS ROSS MARKS -->
  <circle cx="60" cy="60" r="28" fill="none" stroke="#334155" stroke-width="1" />
  
  <!-- Static Orientation Ticks -->
  <text x="60" y="40" font-family="sans-serif" font-size="8" font-weight="bold" fill="#475569" text-anchor="middle">N</text>
  <text x="83" y="63" font-family="sans-serif" font-size="8" font-weight="bold" fill="#475569" text-anchor="middle">E</text>
  <text x="60" y="86" font-family="sans-serif" font-size="8" font-weight="bold" fill="#475569" text-anchor="middle">S</text>
  <text x="37" y="63" font-family="sans-serif" font-size="8" font-weight="bold" fill="#475569" text-anchor="middle">W</text>

  <!-- DIRECTIONAL WEDGE ARROW (Defaults to North / 0 Degrees) -->
  <!-- B4J Class applies rotation transformation perfectly centered at (60, 60) -->
  <g id="compass-arrow" filter="url(#arrowShadow)">
    <!-- High-contrast cyan pointer head pointing up -->
    <path d="M 54 60 L 60 38 L 66 60 Z" fill="#38bdf8" />
    <!-- Muted lower body wedge for physical alignment depth -->
    <path d="M 54 60 L 60 70 L 66 60 Z" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="60" cy="60" r="2" fill="#ffffff" />
  </g>

  <!-- FIXED LIBRARY STANDARD FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">0°</text>
</svg>
