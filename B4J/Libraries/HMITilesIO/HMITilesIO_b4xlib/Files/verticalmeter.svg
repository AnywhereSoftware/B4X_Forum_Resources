<svg xmlns="http://w3.org" id="tile-meter" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Track Slot Contrast Gradient -->
    <linearGradient id="trackBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#151f32" />
    </linearGradient>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="6" fill="transparent" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">METER</text>

  <!-- VERTICAL TRACK STRUCTURE (Proven Dimensions: Total height = 64px, from y=30 to y=94), rx sets rounding -->
  <rect x="23" y="30" width="10" height="64" rx="0" fill="url(#trackBg)" stroke="#090d16" stroke-width="1" />

  <!-- Dynamic Active Level Foreground Indicator Bar, rx sets rounding -->
  <rect id="meter-level" x="23" y="94" width="10" height="0" rx="0" fill="#22c55e" />

  <!-- MEASUREMENT TICKS -->
  <line x1="41" y1="30" x2="41" y2="94" stroke="#475569" stroke-width="4" stroke-dasharray="1 3" />
  <line x1="41" y1="30" x2="46" y2="94" stroke="#94a3b8" stroke-width="2" stroke-dasharray="2 14" />

  <!-- PHYSICAL SCALED LEFT-POINTING ARROW INDICATOR -->
  <!-- Re-plotted points: Tip is at (48,94), Base corners are at (53,91) and (53,97) -->
  <polygon id="meter-arrow" points="48,94 53,91 53,97" fill="#22c55e" />

  <!-- MID-PLATE METRIC DATA VALUE LABELS -->
  <text id="meter-val" x="84" y="70" font-family="monospace" font-size="24" font-weight="bold" fill="#0f172a" text-anchor="middle">0</text>

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">footer</text>
</svg>
