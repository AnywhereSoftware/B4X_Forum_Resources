<svg xmlns="http://www.w3.org/2000/svg" id="tile-battery" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Your standard structural light tile backing -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="0" fill="url(#tileBg)" stroke="#cbd5e1" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">BATTERY</text>

  <!-- BATTERY ICON FRAME (ALL SHIFTED UP BY 6PX) -->
  <!-- Top terminal tip: Y changed from 30 to 24 -->
  <rect x="54" y="24" width="12" height="4" rx="1" fill="#64748b" />
  <!-- Main outer battery body: Y changed from 34 to 28 -->
  <rect x="42" y="28" width="36" height="54" rx="3" fill="none" stroke="#64748b" stroke-width="2" />

  <!-- INTERNAL CHARGE SECTIONS (ALL SHIFTED UP BY 6PX) -->
  <rect id="bat-lvl4" x="46" y="32" width="28" height="9" rx="1" fill="none" />
  <rect id="bat-lvl3" x="46" y="44" width="28" height="9" rx="1" fill="none" />
  <rect id="bat-lvl2" x="46" y="56" width="28" height="9" rx="1" fill="none" />
  <rect id="bat-lvl1" x="46" y="68" width="28" height="9" rx="1" fill="none" />

  <!-- CURRENT VALUE READOUT -->
  <!-- Moved to Y=96 to sit comfortably right between the battery base and your fixed Y=110 footer -->
  <text id="current-value" x="60" y="96" font-family="monospace" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">---%</text>

  <!-- FIXED LIBRARY STANDARD FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">footer</text>
</svg>
