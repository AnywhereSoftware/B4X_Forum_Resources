<svg xmlns="http://w3.org" id="tile-switch" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Dark structural tile backing -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Plastic switch housing frame -->
    <linearGradient id="housingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    
    <!-- Red Active Glow -->
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Green Active Glow -->
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="6" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">SWITCH</text>

  <!-- COMPACT HOUSING (Centered on the canvas) -->
  <rect x="35" y="26" width="50" height="68" rx="4" fill="url(#housingGrad)" stroke="#020617" stroke-width="2" />
  <rect x="40" y="31" width="40" height="58" rx="1" fill="#090d16" />

  <!-- COMPACT ROCKER SEGMENTS -->
  <!-- Top Segment (Default State: OFF / Red Dim) -->
  <rect id="rocker-top" x="42" y="33" width="36" height="26" rx="2" fill="#450a0a" stroke="#1e0202" />
  <!-- <line id="rocker-symbol-i" x1="60" y1="41" x2="60" y2="51" stroke="#991b1b" stroke-width="3" stroke-linecap="round" opacity="0.6" /> -->
  <rect id="rocker-symbol-i" x="58.5" y="41" width="3" height="10" rx="1.5" fill="#991b1b" opacity="0.6" />



  <!-- Bottom Segment (Default State: ON / Green Bright) -->
  <rect id="rocker-bottom" x="42" y="60" width="36" height="27" rx="2" fill="url(#greenGlow)" stroke="#86efac" />
  <circle id="rocker-symbol-o" cx="60" cy="73" r="5" fill="none" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)" />

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">footer</text>
</svg>
