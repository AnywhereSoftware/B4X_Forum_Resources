<svg xmlns="http://w3.org" id="tile-bytestatus" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Dark structural tile backing matching your library standard -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Industrial States Color Palette definitions -->
    <!-- OFF = Soft High-Performance Red | ON = Vibrant Safety Green | DISABLED = Low-Contrast Gray -->
    <linearGradient id="stateOff" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#991b1b"/></linearGradient>
    <linearGradient id="stateOn" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#166534"/></linearGradient>
    <linearGradient id="stateDisabled" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#334155"/></linearGradient>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="6" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">HEADER</text>

  <!-- BIT GRID MATRIX (2 Rows of 4 Blocks) -->
  <!-- Row 1: Bits 0 to 3 -->
  <rect id="bit0" x="12" y="32" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" />
  <rect id="bit1" x="38" y="32" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" />
  <rect id="bit2" x="64" y="32" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" />
  <rect id="bit3" x="90" y="32" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" />

  <!-- Row 2: Bits 4 to 7 -->
  <rect id="bit4" x="12" y="64" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" />
  <rect id="bit5" x="38" y="64" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" />
  <rect id="bit6" x="64" y="64" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" />
  <rect id="bit7" x="90" y="64" width="20" height="25" rx="3" fill="url(#stateDisabled)" stroke="#1e293b" stroke-width="1" />

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="108" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">0x00</text>
</svg>
