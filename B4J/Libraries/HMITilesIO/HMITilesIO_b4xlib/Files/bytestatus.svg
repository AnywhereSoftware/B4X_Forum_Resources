<svg xmlns="http://www.w3.org/2000/svg" id="tile-bytestatus" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Industrial States Color Palette -->
    <linearGradient id="stateOff" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#991b1b"/></linearGradient>
    <linearGradient id="stateOn" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#166534"/></linearGradient>
    <linearGradient id="stateDisabled" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#334155"/></linearGradient>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="0" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">BYTE STATUS</text>

  <!-- BIT GRID MATRIX (2 Rows of 4 Blocks) -->
  <!-- Row 1: Bits 0 to 3 (y=32, text centered vertically at y=48) -->
  <g>
    <rect id="bit0" x="12" y="32" width="20" height="25" rx="3" fill="url(#stateOff)" stroke="#1e293b" stroke-width="1" />
    <text x="22" y="48" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" fill-opacity="0.7" text-anchor="middle" pointer-events="none">0</text>
  </g>
  <g>
    <rect id="bit1" x="38" y="32" width="20" height="25" rx="3" fill="url(#stateOff)" stroke="#1e293b" stroke-width="1" />
    <text x="48" y="48" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" fill-opacity="0.7" text-anchor="middle" pointer-events="none">1</text>
  </g>
  <g>
    <rect id="bit2" x="64" y="32" width="20" height="25" rx="3" fill="url(#stateOff)" stroke="#1e293b" stroke-width="1" />
    <text x="74" y="48" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" fill-opacity="0.7" text-anchor="middle" pointer-events="none">2</text>
  </g>
  <g>
    <rect id="bit3" x="90" y="32" width="20" height="25" rx="3" fill="url(#stateOff)" stroke="#1e293b" stroke-width="1" />
    <text x="100" y="48" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" fill-opacity="0.7" text-anchor="middle" pointer-events="none">3</text>
  </g>

  <!-- Row 2: Bits 4 to 7 (y=64, text centered vertically at y=80) -->
  <g>
    <rect id="bit4" x="12" y="64" width="20" height="25" rx="3" fill="url(#stateOff)" stroke="#1e293b" stroke-width="1" />
    <text x="22" y="80" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" fill-opacity="0.7" text-anchor="middle" pointer-events="none">4</text>
  </g>
  <g>
    <rect id="bit5" x="38" y="64" width="20" height="25" rx="3" fill="url(#stateOff)" stroke="#1e293b" stroke-width="1" />
    <text x="48" y="80" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" fill-opacity="0.7" text-anchor="middle" pointer-events="none">5</text>
  </g>
  <g>
    <rect id="bit6" x="64" y="64" width="20" height="25" rx="3" fill="url(#stateOff)" stroke="#1e293b" stroke-width="1" />
    <text x="74" y="80" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" fill-opacity="0.7" text-anchor="middle" pointer-events="none">6</text>
  </g>
  <g>
    <rect id="bit7" x="90" y="64" width="20" height="25" rx="3" fill="url(#stateOff)" stroke="#1e293b" stroke-width="1" />
    <text x="100" y="80" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" fill-opacity="0.7" text-anchor="middle" pointer-events="none">7</text>
  </g>

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">0x00</text>
</svg>
