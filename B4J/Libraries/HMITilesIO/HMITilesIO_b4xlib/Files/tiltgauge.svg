<svg xmlns="http://www.w3.org/2000/svg" id="tile-gauge" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="needleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="120" height="120" rx="0" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">TILTGAUGE</text>

  <!-- 90-DEGREE TILT ARCS (Pivot center at 42, 78 | Radius = 36) -->
  <!-- Total Arc Length = (PI * Radius 36) / 2 = 56.55px -->
  <g fill="none" stroke-width="6" stroke-linecap="butt">
    <!-- Background Rail Guide (Using your exact base red color or a deep slate if you prefer) -->
    <path id="arc-base" d="M 42 42 A 36 36 0 0 1 78 78" stroke="#334155" />
    
    <!-- Dynamic Position Fill (Using your exact Green color block for seamless UI blending) -->
    <path id="arc-position" d="M 42 42 A 36 36 0 0 1 78 78" stroke="#22c55e" stroke-dasharray="56.55" stroke-dashoffset="56.55" />
  </g>

  <!-- HIGH-CONTRAST NEON CYAN NEEDLE (Perfect layout match) -->
  <g id="gauge-needle" filter="url(#needleShadow)">
    <path d="M 40.5 78 L 42 34 L 43.5 78 Z" fill="#38bdf8" />
    <circle cx="42" cy="78" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="42" cy="78" r="1.5" fill="#ffffff" />
  </g>

  <!-- FIXED LIBRARY STANDARD FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">footer</text>
</svg>
