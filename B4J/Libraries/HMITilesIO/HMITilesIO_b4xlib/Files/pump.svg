<svg xmlns="http://w3.org" viewBox="0 0 120 120" width="120" height="120">
	  <!-- 
		TECHNICAL PUMP & MOTOR ICON 
		Perfectly centered on a 120x120 canvas.
		Muted grays For normal operational status tracking.
	  -->
	  <g id="technical-equipment" stroke-linejoin="round" stroke-linecap="round">
		
		<!-- Foundation / Base Plate Line -->
		<line x1="20" y1="85" x2="100" y2="85" stroke="#7f8c8d" stroke-width="3"/>
		
		<!-- MOTOR SUB-ASSEMBLY (Left Side) -->
		<!-- Motor Housing Block -->
		<rect x="25" y="45" width="35" height="34" fill="#4b6584" stroke="#2d3a4a" stroke-width="1.5"/>
		<!-- Motor Cooling Fins (Internal Details) -->
		<line x1="32" y1="45" x2="32" y2="79" stroke="#2d3a4a" stroke-width="1"/>
		<line x1="42" y1="45" x2="42" y2="79" stroke="#2d3a4a" stroke-width="1"/>
		<line x1="52" y1="45" x2="52" y2="79" stroke="#2d3a4a" stroke-width="1"/>
		<!-- Motor Mount Supports -->
		<rect x="28" y="79" width="6" height="6" fill="#2d3a4a"/>
		<rect x="50" y="79" width="6" height="6" fill="#2d3a4a"/>

		<!-- SHAFT COUPLING (Center Connection) -->
		<rect x="60" y="59" width="8" height="6" fill="#d1d8e0" stroke="#2d3a4a" stroke-width="1"/>

		<!-- PUMP HOUSING SUB-ASSEMBLY (Right Side) -->
		<!-- Centrifugal Pump Volute Casing (Circular Body) -->
		<circle cx="85" cy="62" r="18" fill="#d1d8e0" stroke="#2d3a4a" stroke-width="1.5"/>
		<!-- Pump Center Hub Bearing -->
		<circle cx="85" cy="62" r="4" fill="#4b6584" stroke="#2d3a4a" stroke-width="1"/>
		<!-- Pump Base Mount Support -->
		<polygon points="80,80 90,80 88,85 82,85" fill="#2d3a4a"/>

		<!-- PROCESS PIPING CONNECTIONS -->
		<!-- Suction / Intake Flange (Right horizontal pipe) -->
		<path d="M103,57 L112,57 L112,67 L103,67 Z" fill="#7f8c8d" stroke="#2d3a4a" stroke-width="1"/>
		<!-- Discharge / Outlet Flange (Top vertical pipe) -->
		<path d="M80,44 L90,44 L90,35 L80,35 Z" fill="#7f8c8d" stroke="#2d3a4a" stroke-width="1"/>
		
		<!-- Flow Direction Arrow Hints (Muted / Low Contrast Process Markers) -->
		<path d="M110,73 L102,73 M105,70 L102,73 L105,76" fill="none" stroke="#7f8c8d" stroke-width="1"/>
		<path d="M72,38 L72,30 M69,33 L72,30 L75,33" fill="none" stroke="#7f8c8d" stroke-width="1"/>
		
	  </g>
</svg>
