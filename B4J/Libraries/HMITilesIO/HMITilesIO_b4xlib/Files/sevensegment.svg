<svg xmlns="http://w3.org" id="tile-7segment" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Self-Contained Local Asset Font Face CSS Rule Injection -->
    <style type="text/css">
      @font-face {
        font-family: 'LocalDigitalFont';
        src: url('data:font/ttf;charset=utf-8;base64,#FONT_BASE64_PLACEHOLDER#') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
      .digital-led-display {
        font-family: 'LocalDigitalFont', monospace;
        font-size: 40px;
        font-weight: normal;
        letter-spacing: 1px;
        /* Clean industrial neon glare lens filter halo shadow effect */
        filter: drop-shadow(0px 0px 2px #ef4444);
      }
    </style>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect width="120" height="120" rx="6" fill="transparent" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="20" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">7-SEGMENT</text>

  <!-- CENTRAL DIGITAL READOUT CONTRAST PANEL CHASSIS -->
  <!-- This box holds a dark backdrop container frame to look authentic -->
  <rect x="10" y="38" width="100" height="46" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="1" />
  
  <!-- Single Target Text element for B4X to update instantly -->
  <text id="seg-text" x="60" y="76" class="digital-led-display" text-anchor="middle">0000</text>

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="monospace" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">footer</text>
</svg>
