<svg xmlns="http://www.w3.org/2000/svg" id="tile-sevensegment" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Self-Contained Local Asset Font Face CSS Rule Injection -->
    <style type="text/css">
      @font-face {
        font-family: 'LocalDigitalFont';
        src: url('data:font/ttf;charset=utf-8;base64,#FONT_BASE64_PLACEHOLDER#') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
      .digital-led-display {
        font-family: 'LocalDigitalFont', monospace;
        font-size: 40px;
        font-weight: normal;
        letter-spacing: 1px;
        /* THE FIX: Enforce your dynamic text color fill and glowing halo mask natively */
        fill: #VALUE_FILL#;
        filter: drop-shadow(0px 0px 2px #VALUE_FILL#);
      }
    </style>
  </defs>

  <!-- Base Grid Tile Frame -->
  <rect id="tile-frame" width="120" height="120" rx="0" fill="#FRAME_FILL#" stroke="#FRAME_STROKE#" stroke-width="#FRAME_STROKE_WIDTH#" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="#HEADER_FONT_SIZE#" font-weight="600" fill="#HEADER_FILL#" text-anchor="middle" letter-spacing="0.5">#HEADER_TEXT#</text>

  <!-- CENTRAL DIGITAL READOUT CONTRAST PANEL CHASSIS -->
  <!-- THE FIX: Placeholders allow your setContainerColor routine to bind successfully -->
  <rect id="tile-value-container" x="2" y="38" width="116" height="46" rx="4" fill="#VALUE_CONTAINER_FILL#" stroke="#VALUE_CONTAINER_STROKE#" stroke-width="0" />
  
  <!-- Single Target Text element for B4X to update instantly -->
  <text id="tile-value" x="60" y="76" class="digital-led-display" text-anchor="middle">#VALUE_TEXT#</text>

  <!-- DYNAMIC TEXT FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="#FOOTER_FONT_SIZE#" font-weight="600" fill="#FOOTER_FILL#" text-anchor="middle">#FOOTER_TEXT#</text>
</svg>
