<svg xmlns="http://w3.org" viewBox="0 0 120 120">
  <defs>
    <!-- Muted Process Fluid Gradient (Slate Blue To Steel Blue) -->
    <linearGradient id="fluid-gradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b597a" />
      <stop offset="100%" stop-color="#577590" />
    </linearGradient>
  </defs>

  <g id="storage-tank" stroke-linejoin="round" stroke-linecap="round">
    <!-- Foundation Ground Baseline -->
    <line x1="15" y1="105" x2="105" y2="105" stroke="#7f8c8d" stroke-width="2"/>

    <!-- Live Fluid Volume Rect: Controlled dynamically via JavaScript (Max Height: 70px) -->
    <rect id="tank-fluid" x="32" y="95" width="56" height="0" fill="url(#fluid-gradient)" />

    <!-- Tank Dished Roof (Curved Top Cap) -->
    <path d="M30,25 C30,12 90,12 90,25" fill="#d1d8e0" stroke="#2d3a4a" stroke-width="2" />
    
    <!-- Tank Main Vertical Cylindrical Shell Body -->
    <rect x="30" y="25" width="60" height="70" fill="none" stroke="#2d3a4a" stroke-width="2" />
    
    <!-- Structural Foundation Support Legs (Left And Right) -->
    <rect x="34" y="95" width="8" height="10" fill="#4b6584" stroke="#2d3a4a" stroke-width="1.5" />
    <rect x="78" y="95" width="8" height="10" fill="#4b6584" stroke="#2d3a4a" stroke-width="1.5" />

    <!-- Technical Measurement Scale / Gauge Glass (Right Side) -->
    <g stroke="#2d3a4a" stroke-width="1">
      <!-- Vertical Level Gauge Tracker Track Line -->
      <line x1="98" y1="25" x2="98" y2="95" stroke="#7f8c8d" />
      <!-- Level Tick Marks: 100%, 75%, 50%, 25%, 0% boundaries -->
      <line x1="95" y1="25" x2="101" y2="25" stroke-width="1.5" /> 
      <line x1="96" y1="42.5" x2="100" y2="42.5" />
      <line x1="95" y1="60" x2="101" y2="60" stroke-width="1.5" />  
      <line x1="96" y1="77.5" x2="100" y2="77.5" />
      <line x1="95" y1="95" x2="101" y2="95" stroke-width="1.5" />  
    </g>

    <!-- Process Inlet Pipe Nozzle (Top Entry) -->
    <path d="M45,16 L45,8 L53,8 L53,16" fill="none" stroke="#2d3a4a" stroke-width="1.5" />
    
    <!-- Process Outlet Pipe Nozzle with Flanged Drain Bracket (Bottom Right) -->
    <path d="M90,85 L105,85 L105,89 M103,89 L107,89" fill="none" stroke="#2d3a4a" stroke-width="1.5" />
  </g>
</svg>
