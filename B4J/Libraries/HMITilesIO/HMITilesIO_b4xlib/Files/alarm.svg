<svg xmlns="http://www.w3.org/2000/svg" id="tile-alarm" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Keep the default premium theme base background intact -->
    <linearGradient id="tileBgNormal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>

  <!-- FRAME BACKGROUND BOX -->
  <rect width="120" height="120" rx="0" fill="url(#tileBgNormal)" stroke="#cbd5e1" stroke-width="1" />

  <!-- HIGH-PERFORMANCE BOLD ALERT BORDER -->
  <!-- This element will dynamically handle your ISA color thickness properties! -->
  <rect id="alarm-border" width="118" height="118" x="1" y="1" fill="none" stroke="transparent" stroke-width="3" />

  <!-- HEADER TEXT -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">ALARM SYSTEM</text>

  <!-- CENTRAL BOLD STATUS MESSAGE -->
  <text id="alarm-label" x="60" y="60" 
        font-family="monospace" 
        font-size="24" 
        font-weight="bold" 
        fill="#0f172a" 
        text-anchor="middle" 
        dominant-baseline="central"></text>



  <!-- FOOTER TEXT -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">QUIET</text>
</svg>
