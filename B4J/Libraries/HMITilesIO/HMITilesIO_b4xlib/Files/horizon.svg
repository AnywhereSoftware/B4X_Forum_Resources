<svg xmlns="http://www.w3.org/2000/svg" id="tile-horizon" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Master Dark Grid Theme Base -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Circular Horizon Viewport Clip Mask (Centered at 60,60 | Radius 36) -->
    <clipPath id="horizonClip">
      <circle cx="60" cy="60" r="36" />
    </clipPath>
  </defs>

  <!-- Frame Background Box -->
  <rect width="120" height="120" rx="0" fill="url(#tileBg)" stroke="#334155" stroke-width="1" />

  <!-- DYNAMIC TEXT HEADER -->
  <text id="tile-header" x="60" y="18" font-family="sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle" letter-spacing="0.5">HORIZON</text>

  <!-- DYNAMIC ATTITUDE COMPONENT GROUP (Rotates and shifts dynamically via B4J) -->
  <g id="horizon-gyro-group" clip-path="url(#horizonClip)">
    <!-- The Sky/Ground Base Plane. Initial center at 60,60 -->
    <!-- Pitch translates this up/down; Roll rotates the group around 60,60 -->
    <g id="horizon-pitch-group">
      <!-- Sky Blue Top Half -->
      <rect x="10" y="-20" width="100" height="80" fill="#2a9d8f" />
      <!-- Ground Brown Bottom Half -->
      <rect x="10" y="60" width="100" height="80" fill="#e76f51" />
      <!-- White Horizon Separator Line Strut -->
      <line x1="20" y1="60" x2="100" y2="60" stroke="#ffffff" stroke-width="1.5" />
      
      <!-- Pitch Ladder Pitch Step Bars (Graduated references) -->
      <g stroke="#ffffff" stroke-width="1" opacity="0.75">
        <!-- +10 Degrees Climb -->
        <line x1="48" y1="45" x2="72" y2="45" />
        <!-- +20 Degrees Climb -->
        <line x1="44" y1="30" x2="76" y2="30" />
        <!-- -10 Degrees Dive -->
        <line x1="48" y1="75" x2="72" y2="75" />
        <!-- -20 Degrees Dive -->
        <line x1="44" y1="90" x2="76" y2="90" />
      </g>
    </g>
  </g>

  <!-- STATIC BEZEL RIM GUIDE (Drawn over the moving background to frame it sharply) -->
  <circle cx="60" cy="60" r="36" fill="none" stroke="#475569" stroke-width="2" />

  <!-- HIGH-VISIBILITY FIXED AIRCRAFT SYMBOL (Foreground Reference Anchor) -->
  <g id="fixed-aircraft" stroke="#e9c46a" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Left Wing Reference -->
    <line x1="34" y1="60" x2="48" y2="60" />
    <line x1="48" y1="60" x2="48" y2="64" />
    <!-- Right Wing Reference -->
    <line x1="72" y1="60" x2="86" y2="60" />
    <line x1="72" y1="60" x2="72" y2="64" />
    <!-- Center Fuselage Dot Indicator -->
    <circle cx="60" cy="60" r="1.5" fill="#e9c46a" stroke="none" />
  </g>

  <!-- FIXED LIBRARY STANDARD FOOTER -->
  <text id="tile-footer" x="60" y="110" font-family="sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">0.0°</text>
</svg>
